name: tract_workspace
publish_to: none

# Dart pub workspace root. Member packages set `resolution: workspace` and
# share a single lockfile. Melos drives multi-package tooling on top of this.
environment:
  sdk: ^3.10.0

workspace:
  - packages/tract
  - packages/tract_flutter
  - packages/tract_flutter/example

dev_dependencies:
  melos: ^7.0.0

# Melos 7 reads its configuration from here (the pub-workspace root). CI runs
# these same scripts; each uses the right tool per package (dart vs flutter).
melos:
  name: tract
  scripts:
    analyze:
      description: Analyze all packages.
      run: dart analyze packages/tract && flutter analyze packages/tract_flutter
    format:
      description: Check Dart formatting.
      run: >-
        dart format --output none --set-exit-if-changed
        packages/tract packages/tract_flutter/lib packages/tract_flutter/test
        packages/tract_flutter/example/lib packages/tract_flutter/example/test
    format:fix:
      description: Apply Dart formatting.
      run: >-
        dart format
        packages/tract packages/tract_flutter/lib packages/tract_flutter/test
        packages/tract_flutter/example/lib packages/tract_flutter/example/test
    test:
      description: Run Dart and Flutter tests.
      run: >-
        dart test packages/tract &&
        flutter test packages/tract_flutter/test packages/tract_flutter/example/test
    native:build:
      description: Build the tract_ffi shared library (for CLI/dev use).
      # cd into the crate so its rust-toolchain.toml (stable, for tract's MSRV)
      # is honored.
      run: cd native/tract_ffi && cargo build
    native:test:
      description: Run the Rust crate tests.
      run: cd native/tract_ffi && cargo test
