name: tract_flutter
description: >-
  Neural network inference for Flutter with the goal of no additional system
  dependencies. Integrates the `tract` package and uses cargokit to build the
  native Rust tract library and use it via FFI.
version: 0.0.1
repository: https://github.com/ManyMath/tract
issue_tracker: https://github.com/ManyMath/tract/issues
topics:
  - machine-learning
  - inference
  - onnx
  - tract
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  tract: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
