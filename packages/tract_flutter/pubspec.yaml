name: tract_flutter
description: >-
  Flutter helpers for the tract inference package: load ONNX/NNEF models from
  Flutter assets. Re-exports tract, which builds its Rust engine with a build
  hook.
version: 0.0.1
repository: https://github.com/ManyMath/tract
issue_tracker: https://github.com/ManyMath/tract/issues
topics:
  - machine-learning
  - inference
  - onnx
  - tract
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  tract: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
