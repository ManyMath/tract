name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (tract_ffi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tract/native
    steps:
      - uses: actions/checkout@v4
      # rustup itself; the crate's rust-toolchain.toml picks the toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tract/native
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The crate must also compile for Windows. tract-linalg's build script
      # assembles its kernels with the target's C toolchain, so the check
      # needs MinGW. (Android is built for real by the apk job below.)
      - run: rustup target add x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo check --target x86_64-pc-windows-gnu

  analyze-test:
    name: Analyze & test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # rustup for tract's build hook, which compiles the native library for
      # the tests.
      - uses: dtolnay/rust-toolchain@stable
      # The pub workspace includes Flutter packages, so resolve with Flutter.
      - run: flutter pub get
      # The melos scripts in the root pubspec.yaml are the single definition
      # of what gets formatted, analyzed and tested, locally and here. `test`
      # covers tract, tract_flutter and the example app, including its MNIST
      # checks.
      - run: dart run melos run format
      - run: dart run melos run analyze
      - run: dart run melos run test
      # Verify the package compiles to JavaScript (web stub, no dart:ffi).
      - run: dart compile js packages/tract/example/web_main.dart -o /tmp/tract_web.js

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config xvfb
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: packages/tract_flutter/example
        run: flutter build ${{ matrix.target }} --debug
      # Load the bundled library and classify digits in the real app.
      - name: Run the example end to end
        if: matrix.target == 'linux'
        working-directory: packages/tract_flutter/example
        run: xvfb-run -a flutter test integration_test -d linux
